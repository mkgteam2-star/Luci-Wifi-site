<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" fill="none">
  <!-- Modern gradient background badge -->
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Badge background -->
  <rect x="2" y="8" width="50" height="44" rx="10" fill="url(#brandGradient)"/>
  
  <!-- NLT monogram in white -->
  <text x="27" y="40" font-family="Arial, sans-serif" font-size="22" font-weight="900" fill="white" text-anchor="middle" letter-spacing="-1">NLT</text>
  
  <!-- Company name -->
  <text x="65" y="32" font-family="Arial, sans-serif" font-size="26" font-weight="800" fill="#1e293b" letter-spacing="-0.5">NLT</text>
  <text x="65" y="50" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#3b82f6">Bundles</text>
</svg>
